<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SysPulse — Server Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;600;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="bg-grid" aria-hidden="true"></div>
    <div class="scan-line" aria-hidden="true"></div>

    <!-- ── Top Bar ── -->
    <header class="topbar">
        <div class="topbar__left">
            <button class="hamburger-btn" id="menuBtn" aria-label="Open menu">
                <svg viewBox="0 0 24 24">
                    <line class="line line1" x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round"></line>
                    <line class="line line2" x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round"></line>
                    <line class="line line3" x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round"></line>
                </svg>
            </button>
            <span class="topbar__logo">SYS<span class="accent">PULSE</span></span>
            <span class="topbar__divider">|</span>
            <span class="topbar__hostname" id="hostname">localhost</span>
        </div>
        <div class="topbar__right">
            <span class="status-pill" id="connectionStatus">
                <span class="status-pill__dot"></span>
                <span class="status-pill__text">Connecting…</span>
            </span>
            <span class="topbar__updated">Last updated: <span id="lastUpdated">—</span></span>
            <button class="refresh-btn" id="refreshBtn" title="Refresh now">↺</button>
        </div>
    </header>
    <aside class="drawer" id="drawer">
        <nav class="drawer__nav">
            <button class="drawer__btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-container-icon lucide-container">
                    <path
                        d="M22 7.7c0-.6-.4-1.2-.8-1.5l-6.3-3.9a1.72 1.72 0 0 0-1.7 0l-10.3 6c-.5.2-.9.8-.9 1.4v6.6c0 .5.4 1.2.8 1.5l6.3 3.9a1.72 1.72 0 0 0 1.7 0l10.3-6c.5-.3.9-1 .9-1.5Z" />
                    <path d="M10 21.9V14L2.1 9.1" />
                    <path d="m10 14 11.9-6.9" />
                    <path d="M14 19.8v-8.1" />
                    <path d="M18 17.5V9.4" />
                </svg> Docker Management</button>
            <button class="drawer__btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-clipboard-clock-icon lucide-clipboard-clock">
                    <path d="M16 14v2.2l1.6 1" />
                    <path d="M16 4h2a2 2 0 0 1 2 2v.832" />
                    <path d="M8 4H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h2" />
                    <circle cx="16" cy="16" r="6" />
                    <rect x="8" y="2" width="8" height="4" rx="1" />
                </svg> Log Review</button>
            <button class="drawer__btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-terminal-icon lucide-terminal">
                    <path d="M12 19h8" />
                    <path d="m4 17 6-6-6-6" />
                </svg> SSH Terminal</button>
            <button class="drawer__btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                    viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                    stroke-linejoin="round" class="lucide lucide-folder-bookmark-icon lucide-folder-bookmark">
                    <path d="M12 6v8l3-3 3 3V6" />
                    <path
                        d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z" />
                </svg> File Manager</button>
        </nav>
        <div>
            <div class="drawer__divider"></div>
            <div class="drawer__account">
                <div class="drawer__avatar">A</div>
                <div class="drawer__userinfo">
                    <span class="drawer__username">Dummy</span>
                    <span class="drawer__usersub">Dummy User</span>
                </div>
                <button class="drawer__signout" id="signoutBtn"><svg xmlns="http://www.w3.org/2000/svg" width="24"
                        height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        stroke-linecap="round" stroke-linejoin="round"
                        class="lucide lucide-log-out-icon lucide-log-out">
                        <path d="m16 17 5-5-5-5" />
                        <path d="M21 12H9" />
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
                    </svg></button>
            </div>
    </aside>
    <div class="drawer-backdrop" id="drawerBackdrop"></div>
    <!-- ── Dashboard ── -->
    <main class="dashboard">

        <!--Cpu Card-->
        <div class="hcard" id="card-cpu">
            <div class="hcard__icon-col">
                <svg class="hcard__icon" id="cpuIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                    stroke-width="1.5">
                    <rect x="4" y="4" width="16" height="16" rx="2" />
                    <path d="M9 9h6v6H9z" />
                    <path d="M9 1v3M15 1v3M15 1v3M9 20v3M15 20v3M1 9h3M1 15h3M20 9h3M20 15h3" /> <!--Ai Generated-->
                </svg>
                <span class="hcard__title">CPU</span>
            </div>
            <div class="hcard__metrics">
                <div class="hcard__row">
                    <span class="hcard__label">LOAD</span>
                    <div class="hcard__bar-wrap">
                        <div class="hcard__bar" id="cpuBar"></div>
                    </div>
                    <span class="hcard__val" id="cpuValue">—</span>
                </div>
                <div class="hcard__row">
                    <span class="hcard__label">TEMP</span>
                    <div class="hcard__bar-wrap">
                        <div class="hcard__bar" id="cpuTempBar"></div>
                    </div>
                    <span class="hcard__val" id="cpuTempValue">—</span>
                </div>
            </div>
        </div>
        <!--Memory Card-->
        <div class="hcard" id="card-mem">
            <div class="hcard__icon-col">
                <svg class="hcard__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <rect x="2" y="8" width="20" height="8" rx="1" />
                    <path d="M6 8V6M10 8V6M14 8V6M18 8V6M6 16v2M10 16v2M14 16v2M18 16v2" /> <!--Ai generated-->
                </svg>
                <span class="hcard__title">MEM</span>
            </div>
            <div class="hcard__metrics">
                <div class="hcard__row">
                    <span class="hcard__label">RAM</span>
                    <div class="hcard__bar-wrap">
                        <div class="hcard__bar" id="memoryBar"></div>
                    </div>
                    <span class="hcard__val" id="memoryValue">—</span>
                </div>
                <div class="hcard__row">
                    <span class="hcard__label">SWAP</span>
                    <div class="hcard__bar-wrap">
                        <div class="hcard__bar" id="swapBar"></div>
                    </div>
                    <span class="hcard__val" id="swapValue">—</span>
                </div>
            </div>
        </div>
        <!--Disk Card-->
        <div class="hcard" id="disk-drive">
            <div class="hcard__icon-col">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="var(--accent)" class="bi bi-hdd"
                    viewBox="0 0 16 16">
                    <path d="M4.5 11a.5.5 0 1 0 0-1 .5.5 0 0 0 0 1M3 10.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0" />
                    <path d="M16 11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V9.51c0-.418.105-.83.305-1.197l2.472-4.531A1.5 1.5 0 0 1 4.094 3h7.812a1.5 1.5 0 0 1 1.317.782l2.472 4.53c.2.368.305.78.305 1.198zM3.655 4.26 1.592 8.043Q1.79 8 2 8h12q.21 0 .408.042L12.345 4.26a.5.5 0 0 0-.439-.26H4.094a.5.5 0 0 0-.44.26zM1 10v1a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-1a1 1 0 0 0-1-1H2a1 1 0 0 0-1 1" />
                </svg>
                <span class="hcard__title">DISK</span>
            </div>
            <div class="hcard__metrics" id="diskMetricsContainer"></div>
        </div>
        <!-- Overall Health Card -->
        <section class="hcard health" id="card-health" data-state="loading" aria-live="polite">
            <div class="health__hero">
                <svg class="health__emoji" id="healthEmoji" viewBox="0 0 340 230" aria-hidden="true">
                    <circle cx="160" cy="112" r="82"/>
                    <g class="st st--healthy st--fair"><ellipse cx="132" cy="98" rx="26" ry="20"/> <ellipse cx="188" cy="98" rx="26" ry="20"/> <path d="M158 94 Q160 89 162 94"/> <path d="M106 94 L92 90"/> <path d="M214 94 L228 90"/> <path d="M122 92 l11 -7 M178 92 l11 -7" opacity=".55"/></g>
                    <g class="st st--healthy"><path d="M90 60 Q110 46 134 54"/><path d="M186 54 Q210 46 230 60"/><path d="M104 132 Q160 146 216 132"/><path d="M104 132 Q160 190 216 132"/><path d="M126.4 136.5 V150.6 M148.8 138.7 V159.8 M171.2 138.7 V159.8 M193.6 136.5 V150.6"/><path d="M101 126 Q95 134 102 142 M219 126 Q225 134 218 142"/></g>
                    <g class="st st--fair"><path d="M92 58 Q112 50 134 55"/><path d="M186 55 Q208 50 228 58"/><path d="M124 142 Q160 170 196 142"/><path d="M121 138 l-3 -4 M199 138 l3 -4"/></g>
                    <g class="st st--degraded"><circle cx="130" cy="100" r="9"/><circle cx="130" cy="100" r="3.5"/><circle cx="190" cy="100" r="9"/><circle cx="190" cy="100" r="3.5"/><path d="M110 89 L146 78"/><path d="M174 78 L210 89"/><path d="M130 154 Q145 146 160 154 T190 154"/><path d="M222 60 c-0.8 3.2 -6.4 6.4 -6.4 11.2 a6.4 6.4 0 0 0 12.8 0 c0 -4.8 -5.6 -8 -6.4 -11.2 z"/></g>
                    <g class="st st--unstable"><circle cx="130" cy="100" r="11"/><circle cx="130" cy="100" r="3"/><circle cx="190" cy="100" r="11"/><circle cx="190" cy="100" r="3"/><path d="M110 90 L146 74"/><path d="M174 74 L210 90"/><path d="M126 156 L137.3 148 L148.7 156 L160 148 L171.3 156 L182.7 148 L194 156"/><path d="M220 58 c-1 4 -8 8 -8 14 a8 8 0 0 0 16 0 c0 -6 -7 -10 -8 -14 z"/><path d="M94 72 c-0.7 2.8 -5.6 5.6 -5.6 9.7 a5.6 5.6 0 0 0 11.2 0 c0 -4.1 -4.8 -7 -5.6 -9.7 z"/></g>
                    <g class="st st--critical"><path d="M121 91 L139 109 M139 91 L121 109"/><path d="M181 91 L199 109 M199 91 L181 109"/><path d="M110 92 L146 74"/><path d="M174 74 L210 92"/><ellipse cx="160" cy="160" rx="20" ry="26"/><path d="M148 174 Q160 164 172 174"/><path d="M220 58 c-1 4 -8 8 -8 14 a8 8 0 0 0 16 0 c0 -6 -7 -10 -8 -14 z"/><path d="M66 78 l-12 -3 M64 104 l-14 0 M254 78 l12 -3 M256 104 l14 0"/></g>
                    <g class="st st--healthy st--fair"><g class="occ" transform="translate(16,-2)"><rect x="-14" y="-3" width="30" height="20" rx="5" transform="translate(34,120) rotate(-38)"/><rect x="-5.5" y="-27" width="11" height="27" rx="5.5" transform="translate(36,90) rotate(-66)"/><rect x="-5.5" y="-27" width="11" height="27" rx="5.5" transform="translate(44,84) rotate(-42)"/><rect x="-5.5" y="-27" width="11" height="27" rx="5.5" transform="translate(53,81) rotate(-18)"/><circle cx="52" cy="98" r="18"/><rect x="-5" y="-26" width="10" height="28" rx="5" transform="translate(60,88) rotate(100)"/><rect x="-5" y="-26" width="10" height="28" rx="5" transform="translate(58,108) rotate(70)"/></g></g>
                    <g class="thumb"><g class="occ"><rect x="266" y="116" width="15" height="46" rx="7.5"/><rect x="260" y="148" width="48" height="42" rx="13"/></g><path d="M280 162 H301 M280 173 H301 M280 183 H301"/></g>
                </svg>
                <div class="health__label" id="healthLabel">Checking…</div>
                <div class="health__sub" id="healthSub">Waiting for the backend</div>
            </div>

            <div class="health__issues">
                <div class="health__issues-head"><span>ISSUES</span><span id="issueCount">0</span></div>
                <ul class="health__list" id="issueList"></ul>
            </div>

            <div class="health__footer">
                <div class="health-tile">
                    <span class="health-tile__label">UPTIME</span>
                    <span class="health-tile__value" id="healthUptime">—</span>
                </div>
                <div class="health-tile">
                    <span class="health-tile__label">CLOCK</span>
                    <span class="health-tile__value" id="healthClock">—</span>
                </div>
                <div class="health-tile" title="Share of the last 7 days the backend was running">
                    <span class="health-tile__label">UPTIME %</span>
                    <span class="health-tile__value" id="healthUptimePct">—</span>
                </div>
            </div>
        </section>
    </main>
    <div class="toastBiscuit">
        <div class="toast__icon"></div>
        <div class="toast__content"></div>
    </div>
    <!-- ── Footer ── -->
    <footer class="footer">
        <span class="footer__label">ENDPOINT</span>
        <span class="footer__value" id="endpointValue">—</span>
    </footer>

    <script src="script.js"></script>
</body>

</html>
