services:
  syspulse-backend:
    build:
      context: ..
      dockerfile: Docker/Dockerfile
    container_name: syspulse-backend
    user: "1000:1000"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      SYSPULSE_DB: /data/users.db
    volumes:
      - ./data:/data
      - /mnt:/mnt:ro
    tmpfs:
      - /tmp
      - /run
    restart: unless-stopped